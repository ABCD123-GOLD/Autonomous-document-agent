[project]
name = "production-rag-api"
version = "0.1.0"
description = "Production-grade RAG API with FastAPI, Supabase, and Gemini Flash"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "anthropic>=0.5.0",
    "openai>=1.0.0",
    "supabase>=2.0.0",
    "pypdf2>=3.0.0",
    "tiktoken>=0.4.0",
    "pydantic-settings>=2.0.0",
    "slowapi>=0.1.8",
    "python-multipart>=0.0.6",
    "python-telegram-bot>=20.0",
    "structlog>=23.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
